<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Cattle Detection</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🐄 Cattle Detection - System Test</h1>
    
    <div id="tests"></div>
    
    <script>
        const tests = document.getElementById('tests');
        
        function addTest(name, status, message) {
            const div = document.createElement('div');
            div.className = `status ${status}`;
            div.innerHTML = `<strong>${name}:</strong> ${message}`;
            tests.appendChild(div);
        }
        
        // Test 1: Basic JavaScript
        try {
            addTest('JavaScript', 'success', 'Working correctly');
        } catch (e) {
            addTest('JavaScript', 'error', 'Error: ' + e.message);
        }
        
        // Test 2: TensorFlow.js availability
        const tfScript = document.createElement('script');
        tfScript.src = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0/dist/tf.min.js';
        tfScript.onload = () => {
            addTest('TensorFlow.js', 'success', 'Library loaded successfully');
        };
        tfScript.onerror = () => {
            addTest('TensorFlow.js', 'error', 'Failed to load library');
        };
        document.head.appendChild(tfScript);
        
        // Test 3: Teachable Machine availability
        const tmScript = document.createElement('script');
        tmScript.src = 'https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js';
        tmScript.onload = () => {
            addTest('Teachable Machine', 'success', 'Library loaded successfully');
        };
        tmScript.onerror = () => {
            addTest('Teachable Machine', 'error', 'Failed to load library');
        };
        document.head.appendChild(tmScript);
        
        // Test 4: Model files
        fetch('./model/model.json')
            .then(response => {
                if (response.ok) {
                    addTest('Model Files', 'success', 'Model files accessible');
                } else {
                    addTest('Model Files', 'error', `Model not accessible (${response.status})`);
                }
            })
            .catch(error => {
                addTest('Model Files', 'error', 'Model files not found or network error');
            });
        
        // Test 5: File API support
        if (window.File && window.FileReader && window.FileList && window.Blob) {
            addTest('File API', 'success', 'File upload supported');
        } else {
            addTest('File API', 'error', 'File upload not supported');
        }
        
        // Test 6: Camera API support
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            addTest('Camera API', 'success', 'Camera access supported');
        } else {
            addTest('Camera API', 'info', 'Camera access not supported (optional)');
        }
        
        addTest('System Status', 'info', 'Test complete. If all tests pass, the main app should work correctly.');
    </script>
    
    <br>
    <a href="index.html" style="display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px;">Go to Main App</a>
</body>
</html>
